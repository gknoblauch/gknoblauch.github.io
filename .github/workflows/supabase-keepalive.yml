name: Supabase keep-alive

# Free-tier Supabase projects auto-pause after 7 days of inactivity. This runs a
# tiny read against the REST API once a day so the pickleball project stays
# active between games. Only takes effect once this file is on the default
# branch. Note: GitHub disables scheduled workflows after ~60 days with no repo
# commits — harmless here, and a paused project unpauses in one click anyway.

on:
  schedule:
    - cron: "17 8 * * *" # daily at 08:17 UTC (off the hour, per GitHub's advice)
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        # The anon key is a public, publishable key (already shipped in the site
        # at src/lib/supabase.ts); row-level security protects the data.
        env:
          SUPABASE_URL: https://bxgrzgbelxuisjhiucts.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_-bTe9bRelo-7Ej6U3MGpsA_rf1oMrBv
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/games?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase responded with HTTP ${code}"
          # 2xx means the query ran (activity recorded); anything else fails the job.
          case "$code" in
            2*) echo "Keep-alive OK" ;;
            *) echo "Unexpected status ${code}" >&2; exit 1 ;;
          esac
